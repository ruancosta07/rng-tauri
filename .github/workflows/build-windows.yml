name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Download and bundle OCR tools
        shell: pwsh
        run: |
          $bins = "src-tauri/resources/bins"
          New-Item -ItemType Directory -Force -Path "$bins/tessdata" | Out-Null

          # Poppler (pdftoppm + pdftotext)
          $release = Invoke-RestMethod "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "Release.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive poppler.zip -DestinationPath poppler-extracted
          $popplerBin = (Get-ChildItem -Recurse -Path poppler-extracted -Filter "pdftoppm.exe" | Select-Object -First 1).DirectoryName
          Copy-Item "$popplerBin\pdftoppm.exe" $bins
          Copy-Item "$popplerBin\pdftotext.exe" $bins
          Copy-Item "$popplerBin\*.dll" $bins

          # Tesseract + eng.traineddata
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          Copy-Item "$tess\tesseract.exe" $bins
          Get-ChildItem "$tess" -Filter "*.dll" | Copy-Item -Destination $bins
          Copy-Item "$tess\tessdata\eng.traineddata" "$bins\tessdata\"

          # MSVC runtime DLLs required by tesseract
          $sys32 = "C:\Windows\System32"
          foreach ($dll in @("MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")) {
            if (Test-Path "$sys32\$dll") {
              Copy-Item "$sys32\$dll" $bins
            }
          }

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Out-File "src-tauri/tauri.conf.json" -Encoding utf8NoBOM
          Write-Host "Versao definida: $version"

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          Write-Host "=== Conteudo do bundle ==="
          Get-ChildItem "src-tauri/target/release/bundle" -Recurse | ForEach-Object { Write-Host $_.FullName }

          $version = "${{ github.ref_name }}".TrimStart("v")
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $zip = Get-ChildItem "$nsisDir" -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $zip) { throw "Nenhum .nsis.zip encontrado em $nsisDir" }
          $sig = Get-Content "$($zip.FullName).sig" -Raw

          $repo = "ruancosta07/rng-tauri"
          $tag  = "${{ github.ref_name }}"
          $encodedName = [System.Uri]::EscapeDataString($zip.Name)
          $url  = "https://github.com/$repo/releases/download/$tag/$encodedName"
          $date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")

          $json = @{
            version   = $version
            notes     = "Veja o changelog completo em https://github.com/$repo/releases/tag/$tag"
            pub_date  = $date
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5

          $json | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
          Write-Host "latest.json gerado:"
          Get-Content latest.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: renomeador-guias-${{ github.ref_name }}-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: renomeador-guias-${{ github.ref_name }}-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
          generate_release_notes: true
